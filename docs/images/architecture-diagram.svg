<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Daz3D-MCP architecture</title>
  <desc id="description">You describe a scene in plain language to Claude Code, Claude Desktop, Codex, Cursor, Antigravity, or any MCP client. The client connects via MCP over stdio to the Python daz3d-mcp server, which runs with uvx and provides 65 tools, skills, and a content index. The server uses TCP at 127.0.0.1:18640 to reach the bridge plugin inside Daz Studio 6, or uses a dashed no-plugin fallback path directly to DAZ Script. DAZ Script controls the scene, and the Iray renderer uses an NVIDIA GPU with denoising. Outputs are PNG renders, numbered dialogue shots with shots.json, and MP4 or GIF animations, ready for games and visual novels. Install: uvx daz3d-mcp setup + install --all. Windows 10/11.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #eef3fc; }
      .title { font-size: 53px; font-weight: 700; letter-spacing: -1.3px; }
      .subtitle { font-size: 26px; font-weight: 400; fill: #aabad1; }
      .heading { font-size: 28px; font-weight: 700; letter-spacing: -.45px; }
      .label { font-size: 22px; font-weight: 600; }
      .body { font-size: 21px; }
      .secondary { fill: #b9c7db; }
      .small { font-size: 20px; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
      .protocol { font-size: 19px; font-weight: 600; fill: #9cece8; }
      .fallback-label { font-size: 19px; fill: #c3ccdd; }
      .panel { fill: #111927; stroke: #303f54; stroke-width: 1.4; }
      .card { fill: #192437; stroke: #2a3a50; stroke-width: 1.1; }
      .rule { stroke: #2a384c; stroke-width: 1.2; }
      .icon-tile { fill: #1b2c3d; }
      .icon { color: #99e5e0; }
      .module-icon { color: #bdb5fa; }
      .flow { fill: none; stroke: #79e9e2; stroke-width: 2.5; marker-end: url(#arrow); }
      .glow { fill: none; stroke: #48e1dd; stroke-width: 6; opacity: .44; filter: url(#soft-glow); }
      .fallback { fill: none; stroke: #a6b6cc; stroke-width: 1.6; stroke-dasharray: 5 6; marker-end: url(#arrow-muted); }
      .internal { fill: none; stroke: #8593b5; stroke-width: 1.5; marker-end: url(#arrow-internal); }
      .shot-number { fill: #f5f5ff; font-size: 15px; font-weight: 700; }
    </style>


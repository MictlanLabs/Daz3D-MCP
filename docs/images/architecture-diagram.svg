    </marker>
    <marker id="arrow-internal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l6 3-6 3z" fill="#8593b5"/>
    </marker>


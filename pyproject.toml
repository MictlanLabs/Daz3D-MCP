[project]
name = "daz3d-mcp"
version = "0.4.0"
description = "MCP server and skills that let AI agents control Daz Studio"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daz3D-MCP contributors" }]
keywords = ["daz", "daz3d", "daz studio", "mcp", "ai", "agents", "3d"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "mcp>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/MictlanLabs/Daz3D-MCP"
Issues = "https://github.com/MictlanLabs/Daz3D-MCP/issues"

[project.scripts]
daz3d-mcp = "daz3d_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daz3d_mcp"]

# The DazScript library, the skills and the built-in animations live at the top of the repo so they are
# easy to find; they are copied into the package when it is built.
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "daz3d_mcp/_data/scripts"
"skills" = "daz3d_mcp/_data/skills"
"animations" = "daz3d_mcp/_data/animations"

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "skills", "animations", "tests", "README.md", "LICENSE"]

# uv/uvx reuse a cached build of a local checkout until one of these files changes. By default only
# pyproject.toml counts, so `uvx --from <checkout>` kept serving old tools after code changes.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "scripts/**/*" },
  { file = "skills/**/*" },
  { file = "animations/**/*" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
